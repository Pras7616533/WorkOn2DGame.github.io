<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four | 2D Games</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="../../index.html">2D Games</a>
            <nav class="nav-links">
                <a href="../../index.html">Landing</a>
                <a href="../../templates/home.html">Home</a>
                <a href="../../templates/game.html">Games</a>
            </nav>
        </header>

        <main class="layout">
            <section class="intro">
                <p class="eyebrow">Strategy</p>
                <h1>Connect Four</h1>
                <p>Drop your discs into the grid. First player to connect four in a row wins.</p>

                <div class="status-card">
                    <div>
                        <span>Current Turn</span>
                        <strong data-turn>Red</strong>
                    </div>
                    <div>
                        <span>Moves</span>
                        <strong data-moves>0</strong>
                    </div>
                    <div>
                        <span>Winner</span>
                        <strong data-winner>—</strong>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn primary" data-action="reset">New Game</button>
                </div>
            </section>

            <section class="board-wrap">
                <div class="board" data-board aria-label="Connect Four board"></div>
                <p class="hint">Tip: Click a column to drop a disc.</p>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 2D Games. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
