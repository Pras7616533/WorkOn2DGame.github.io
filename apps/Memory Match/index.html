<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match | 2D Games</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="../../index.html">2D Games</a>
            <nav class="nav-links">
                <a href="../../index.html">Landing</a>
                <a href="../../templates/home.html">Home</a>
                <a href="../../templates/game.html">Games</a>
            </nav>
        </header>

        <main class="layout">
            <section class="intro">
                <p class="eyebrow">Memory Game</p>
                <h1>Memory Match</h1>
                <p>Flip the cards, remember the symbols, and clear all pairs with the fewest moves.</p>

                <div class="status-card">
                    <div>
                        <span>Moves</span>
                        <strong data-moves>0</strong>
                    </div>
                    <div>
                        <span>Matches</span>
                        <strong data-matches>0</strong>
                    </div>
                    <div>
                        <span>Time</span>
                        <strong data-time>00:00</strong>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn primary" data-action="new">New Game</button>
                    <button class="btn ghost" data-action="hint">Hint</button>
                </div>
            </section>

            <section class="board-wrap">
                <div class="board" data-board></div>
                <p class="hint">Tip: Try to finish in under 20 moves.</p>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 2D Games. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
